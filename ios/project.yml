# Xcode project for the Houston iPhone app, generated with XcodeGen (see docs/apps.md):
#   brew install xcodegen && cd ios && xcodegen
# Then open Houston.xcodeproj, pick your team under Signing & Capabilities, and run on your iPhone.
name: Houston
options:
  bundleIdPrefix: io.github.eisenreichgit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Houston:
    type: application
    platform: iOS
    sources: [Houston, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eisenreichgit.houston
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Houston/Info.plist
      properties:
        CFBundleDisplayName: Houston
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Houston connects to your Apollo on your home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    dependencies:
      - target: HoustonWidget
        embed: true
  HoustonWidget:
    type: app-extension
    platform: iOS
    sources: [HoustonWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eisenreichgit.houston.widget
    info:
      path: HoustonWidget/Info.plist
      properties:
        CFBundleDisplayName: Houston
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: The Houston widget reads your Apollo's status on your home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
