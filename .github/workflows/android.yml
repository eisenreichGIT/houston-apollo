# Builds the Houston Android app (android/) on GitHub's servers.
# - Every push that touches android/: an APK you can download from the run's "Artifacts".
# - A release tag (v*): the APK is also attached to that release.
# Signing: add the repository secrets HOUSTON_KEYSTORE_BASE64 and HOUSTON_KEYSTORE_PASSWORD (see docs/apps.md)
# so every build is signed with the same key and installs as an update. Without them you get a debug build.
name: Android app

on:
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04        # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner; make sure platform 34 is there)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KS: ${{ secrets.HOUSTON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/houston.jks"
            echo "HOUSTON_KEYSTORE=$RUNNER_TEMP/houston.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets: building a debug APK (it won't install as an update over other builds)."
          fi

      - name: Build
        working-directory: android
        env:
          HOUSTON_KEYSTORE_PASSWORD: ${{ secrets.HOUSTON_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = 1 ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Houston.apk"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Houston.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Houston-android
          path: ${{ runner.temp }}/Houston.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/Houston.apk" "$RUNNER_TEMP/Houston-${GITHUB_REF_NAME}.apk"
          # Release notes = this version's section of CHANGELOG.md (Houston shows them under "What's new")
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Houston ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Houston-${GITHUB_REF_NAME}.apk" --clobber
