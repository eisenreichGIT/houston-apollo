# Builds the Houston Android app (android/) on GitHub's servers.
# - Every push that touches android/: an APK you can download from the run's "Artifacts".
# - A release tag (v*): the APK is also attached to that release.
# Signing: add the repository secrets HOUSTON_KEYSTORE_BASE64 and HOUSTON_KEYSTORE_PASSWORD (see docs/apps.md)
# so every build is signed with the same key and installs as an update. Without them you get a debug build.
name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KS: ${{ secrets.HOUSTON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/houston.jks"
            echo "HOUSTON_KEYSTORE=$RUNNER_TEMP/houston.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets: building a debug APK (it won't install as an update over other builds)."
          fi

      - name: Build
        working-directory: android
        env:
          HOUSTON_KEYSTORE_PASSWORD: ${{ secrets.HOUSTON_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = 1 ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Houston.apk"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Houston.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Houston-android
          path: ${{ runner.temp }}/Houston.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/Houston.apk" "$RUNNER_TEMP/Houston-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Houston ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Houston-${GITHUB_REF_NAME}.apk" --clobber
